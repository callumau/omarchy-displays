name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id == "io.github.callumau.displays"' manifest.json
          jq -e '.kinds | index("bar-widget") and index("service")' \
            manifest.json
          jq -r '.entryPoints[]' manifest.json | while read -r entry; do
            test -f "$entry"
          done
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"

      - name: Check scripts and Python
        run: |
          bash -n apply-displays.sh
          bash -n tests/load-check.sh
          python3 -m py_compile apply-order.py

      - name: Run tests
        run: |
          node tests/model.test.js
          node tests/drag.test.js
          bash tests/apply-order.test.sh
          bash tests/apply-displays.test.sh
